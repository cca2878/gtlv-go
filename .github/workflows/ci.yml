name: CI

on:
  push:
    branches: [dev, main] # dev = snapshot verification; main = formal (post-merge)
  pull_request:
    branches: [main] # gate the dev -> main PR

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub's `paths:` filter is workflow-level, not per-job, so to run the slow
  # Rust job only when the Rust core changes we detect it here and gate that job
  # with `needs`/`if`. The wasm is committed, so Go-only PRs skip Rust entirely.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'rust-wasm/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  test:
    name: Go (lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The library carries the committed wasm.zst via go:embed, so the Go
      # side needs no Rust toolchain, models, or network (unit tests are
      # httptest / offline pure-Go packages).
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod verify
        run: go mod verify

      - name: test
        run: go test -race ./...

      - name: boundary (only pkg/client may touch net/http)
        run: make check-boundary

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    # A push to dev and the PR that follows both run this workflow, and the two
    # events land in different concurrency groups, so neither cancels the other.
    # Rather than drop one of the runs — the required checks have to come from
    # the PR event, and merging the groups would let a push cancel the PR's
    # checks — keep dev's run to the fast feedback and leave the six-platform
    # cross-compile to where it earns its keep: the PR gate, and main after the
    # merge. Turns a dev push from ~5 minutes back into ~50 seconds.
    if: ${{ github.event_name == 'pull_request' || github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pure-Go cross-compile across every supported platform. CGO_ENABLED=0
      # also enforces the no-CGO invariant: any accidental cgo dep fails here.
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  rust:
    name: Rust (wasm build · test)
    needs: changes
    # Always runs on a PR so it can serve as a required status check (a job that
    # is conditionally skipped can never satisfy one). On dev pushes it stays
    # path-gated, since the Rust build is the slow part of this workflow.
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Honor rust-toolchain.toml (pinned channel + components + targets) so CI
      # uses the exact same toolchain as local `make check` — no version skew.
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-wasm

      - name: cargo fmt
        run: cargo fmt --manifest-path rust-wasm/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path rust-wasm/Cargo.toml --release --locked -- -D warnings

      # Goes through make so the build uses the same reproducibility flags as a
      # developer's `make check` (pinned toolchain + --locked + path remapping);
      # a bare `cargo build` here would produce different bytes and fail below.
      # The step builds the wasm and byte-compares it against the committed
      # artifact, which is what keeps "remember to rebuild the wasm" from being
      # a matter of discipline. Advisory on dev (the wasm may lag during
      # iteration), enforced on the PR into main.
      - name: build wasm + verify it matches the committed artifact
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: make verify-wasm

      - name: cargo test (host)
        run: cargo test --manifest-path rust-wasm/Cargo.toml --release --locked
