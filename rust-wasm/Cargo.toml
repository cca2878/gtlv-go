[package]
name = "captcha-wasm"
version = "0.1.0"
edition = "2021"
description = "极验点选求解推理核心，编译为 wasm32-wasip1，供 Go 侧经 wazero 加载（纯 WASM，无 CGO）"

[lib]
name = "captcha_wasm"
crate-type = ["cdylib"]

[dependencies]
# 纯核（推理逻辑 + 领域类型），独立仓 ref/captcha/project/gtlv-core；tract/image 等经此传递依赖，
# 壳本身只做 wasm ABI + wire 序列化。开发期 path 依赖，core 稳定后可切 git rev 锁版本。
gtlv-core = { path = "../../gtlv-core" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
