[package]
name = "captcha-wasm"
version = "0.1.0"
edition = "2021"
description = "gt 点选求解推理核心，编译为 wasm32-wasip1，供 Go 侧经 wazero 加载（纯 WASM，无 CGO）"

[lib]
name = "captcha_wasm"
crate-type = ["cdylib"]

[dependencies]
# 纯核（推理逻辑 + 领域类型 + 内嵌模型），tract/image 等经此传递依赖，壳本身只做 wasm ABI + wire 序列化。
# 钉到发布 tag：模型即其产物的一部分，故随仓提交的 captcha_wasm.wasm.zst 可追溯到确定的核版本，
# 升级须是显式动作；Cargo.lock 另记录解析出的精确 commit，可复现性不依赖 tag 本身。
# 就地改核调试：cargo build --config 'patch."https://github.com/cca2878/gtlv-core".gtlv-core.path="../../gtlv-core"'
gtlv-core = { git = "https://github.com/cca2878/gtlv-core", tag = "v0.1.1" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
